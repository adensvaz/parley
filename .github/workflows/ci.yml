name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: parley-contracts
        run: npm install --no-audit --no-fund && npx tsc --noEmit
  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: parley }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in $(ls parley-infra/db/migrations/*.sql | sort); do
            echo "applying $f"; PGPASSWORD=pw psql -h localhost -U postgres -d parley -v ON_ERROR_STOP=1 -f "$f"
          done

  # Engine logic tests — run via tsx (type-only imports are erased, so no workspace install needed).
  # Each test file exits non-zero on failure, so a broken assertion fails the job.
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g tsx@4
      - name: copilot engine (affect, culture, behaviour, patterns, objectives)
        working-directory: parley-copilot-service
        run: |
          for t in affect culture behaviour patterns objectives; do echo "── $t ──"; tsx qa/$t.test.ts; done
      - name: gateway affect DSP
        working-directory: parley-gateway
        run: tsx qa/affect.test.ts
      - name: compliance rails (TCPA guard)
        working-directory: parley-compliance-service
        run: tsx qa/guard.test.ts
